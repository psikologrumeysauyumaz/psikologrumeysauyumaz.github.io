<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psikoloji Testi - Psikolog Rümeysa Uyumaz</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon-flower.svg">
    <link rel="apple-touch-icon" href="../../assets/favicon-flower.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #166534;
            --primary-dark: #14532D;
            --primary-light: #22c55e;
            --secondary: #f0fdf4;
            --bg-color: #F9FCFF;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #334155;
            background-color: var(--bg-color);
            line-height: 1.6;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Playfair Display', serif;
            color: #1e293b;
            line-height: 1.25;
        }

        /* Navigation */
        .floating-nav {
            backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        /* Gradient Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px 0 rgba(22, 101, 52, 0.2);
            border: none;
        }

        .btn-primary:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 101, 52, 0.3);
        }

        .btn-primary:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: white;
            color: #334155;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: #f0fdf4;
            transform: translateY(-1px);
        }

        /* Cards */
        .question-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        /* Result Card - Enhanced but consistent */
        .result-card {
            background: white;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* Option Buttons */
        .option-button {
            background: #fff;
            border: 2px solid #f1f5f9;
            border-radius: 16px;
            padding: 1.25rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            color: #475569;
        }

        .option-button:hover {
            border-color: #bbf7d0;
            background-color: #f0fdf4;
            color: #166534;
        }

        .option-button.selected {
            border-color: var(--primary);
            background-color: #f0fdf4;
            color: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(22, 101, 52, 0.1);
            font-weight: 600;
        }

        /* Progress Bar */
        .progress-bar {
            background: linear-gradient(90deg, #166534, #22c55e);
            border-radius: 9999px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Chart */
        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
        }

        /* Professional Insight Card */
        .professional-insight {
            display: flex;
            align-items: flex-start;
            gap: 1.5rem;
            padding: 2rem;
            border-radius: 20px;
            background: linear-gradient(135deg, #ecfdf5 0%, #f0f9ff 100%);
            border: 1px solid rgba(22, 101, 52, 0.1);
            margin-top: 2rem;
        }

        .professional-insight-icon {
            flex-shrink: 0;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .share-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: white;
            border: 1px solid #e2e8f0;
            color: #475569;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }

        .share-button:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
            transform: translateY(-2px);
        }

        /* Loading Overlay */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="antialiased">
    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner mb-4"></div>
        <div class="text-xl font-medium text-gray-700">Test Yükleniyor...</div>
    </div>

    <!-- Floating Navigation -->
    <nav class="floating-nav fixed top-4 left-4 right-4 mx-auto max-w-7xl rounded-lg shadow-lg z-50 py-3 px-6 flex justify-between items-center transition-all duration-500"
        style="max-width: 1200px;" id="mainNav">
        <div class="text-xl font-semibold" style="color: #333333; font-family: 'Playfair Display', serif;">
            <a href="../../index.html">Psk. Rümeysa Uyumaz</a>
        </div>
        <div class="hidden md:flex space-x-8">
            <a href="../../index.html#home" class="hover:text-[#16A34A] transition-colors">Ana Sayfa</a>
            <a href="../../index.html#about" class="hover:text-[#16A34A] transition-colors">Hakkımda</a>
            <a href="tests.html" class="text-[#16A34A] font-medium">Testler</a>
            <a href="../../index.html#contact" class="hover:text-[#16A34A] transition-colors">İletişim</a>
        </div>
        <div class="md:hidden cursor-pointer" onclick="toggleDrawer()">
            <i data-feather="menu"></i>
        </div>
    </nav>

    <!-- Mobile Drawer -->
    <div id="mobileDrawer"
        class="fixed inset-0 z-40 bg-black bg-opacity-50 transition-opacity duration-300 opacity-0 pointer-events-none">
        <div
            class="absolute right-0 top-0 h-full w-64 bg-white transform transition-transform duration-300 translate-x-full">
            <div class="p-6">
                <div class="flex justify-between items-center mb-8">
                    <div class="text-xl font-semibold" style="color: #333333; font-family: 'Playfair Display', serif;">
                        Menü</div>
                    <button onclick="toggleDrawer()" class="p-2">
                        <i data-feather="x" class="w-6 h-6"></i>
                    </button>
                </div>
                <div class="space-y-6">
                    <a href="../../index.html#home" class="block py-2 hover:text-[#16A34A] transition-colors"
                        onclick="toggleDrawer()">Ana Sayfa</a>
                    <a href="../../index.html#about" class="block py-2 hover:text-[#16A34A] transition-colors"
                        onclick="toggleDrawer()">Hakkımda</a>
                    <a href="tests.html" class="block py-2 text-[#16A34A] font-medium"
                        onclick="toggleDrawer()">Testler</a>
                    <a href="../../index.html#contact" class="block py-2 hover:text-[#16A34A] transition-colors"
                        onclick="toggleDrawer()">İletişim</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Test Container -->
    <div class="pt-24 pb-16 px-4 md:px-8 min-h-screen">
        <div class="max-w-4xl mx-auto">

            <!-- Test Header -->
            <div id="testHeader" class="text-center mb-8">
                <h1 id="testTitle" class="text-3xl md:text-4xl font-bold mb-4"></h1>
                <p id="testDescription" class="text-lg text-gray-600 mb-6"></p>

                <!-- Progress Bar -->
                <div class="w-full bg-gray-200 rounded-full h-3 mb-6">
                    <div id="progressBar" class="progress-bar h-3 rounded-full" style="width: 0%"></div>
                </div>
                <div class="text-sm text-gray-500">
                    <span id="currentQuestion">1</span> / <span id="totalQuestions">10</span> soru
                </div>
            </div>

            <!-- Question Card -->
            <div id="questionContainer" class="question-card p-8 shadow-lg mb-8">
                <h3 id="questionText" class="text-xl font-semibold mb-6"></h3>
                <div id="optionsContainer" class="space-y-4"></div>

                <div class="flex justify-between mt-8">
                    <button id="prevButton" class="btn-secondary px-6 py-3 rounded-lg font-medium"
                        onclick="previousQuestion()" style="display: none;">Geri</button>
                    <button id="nextButton" class="btn-primary px-6 py-3 rounded-lg font-medium ml-auto"
                        onclick="nextQuestion()" disabled>Devam Et</button>
                </div>
            </div>

            <!-- Results Container -->
            <div id="resultsContainer" class="hidden">
                <div class="result-card p-8 shadow-lg mb-8">
                    <h2 class="text-3xl font-bold mb-6 text-center">Test Sonucunuz</h2>

                    <!-- Chart Container -->
                    <div id="resultChartWrapper" class="chart-container mb-8">
                        <canvas id="resultChart"></canvas>
                    </div>

                    <div id="resultContent" class="mb-8"></div>

                    <!-- Professional Note -->
                    <div class="professional-insight mb-8">
                        <div class="professional-insight-icon">💡</div>
                        <div class="professional-insight-body">
                            <h4 class="professional-insight-title">Uzman Görüşü</h4>
                            <p id="professionalNote" class="professional-insight-text"></p>
                            <a href="../../index.html#contact" class="professional-insight-link">
                                Bu sonuçlar hakkında detaylı görüşmek ister misiniz? →
                            </a>
                        </div>
                    </div>

                    <!-- Social Share -->
                    <div class="text-center">
                        <h4 class="text-lg font-semibold mb-4">Sonuçlarını Paylaş</h4>
                        <div class="flex justify-center gap-4 flex-wrap">
                            <button onclick="shareToWhatsApp()" class="share-button">
                                <i data-feather="message-circle" class="w-5 h-5 inline mr-2"></i>WhatsApp
                            </button>
                            <button onclick="shareToTwitter()" class="share-button">
                                <i data-feather="twitter" class="w-5 h-5 inline mr-2"></i>Twitter
                            </button>
                            <button onclick="shareToInstagram()" class="share-button">
                                <i data-feather="instagram" class="w-5 h-5 inline mr-2"></i>Instagram
                            </button>
                            <button onclick="downloadResult()" class="share-button">
                                <i data-feather="download" class="w-5 h-5 inline mr-2"></i>PDF İndir
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Other Tests -->
                <div class="text-center">
                    <h3 class="text-2xl font-bold mb-6">Diğer Testler</h3>
                    <a href="tests.html" class="btn-secondary inline-block px-8 py-3 rounded-lg font-medium">Tüm
                        Testleri Gör</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import TestEngine from '../components/TestEngine.js';

        document.addEventListener('DOMContentLoaded', async () => {
            feather.replace(); // Initial icon replacement

            const urlParams = new URLSearchParams(window.location.search);
            const testParam = urlParams.get('test');

            if (testParam) {
                const testFile = decodeURIComponent(testParam);
                const engine = new TestEngine(testFile);
                const loaded = await engine.loadTest();
                if (loaded) {
                    engine.start();
                    // Make test data available globally for legacy share functions
                    window.currentTestForSharing = engine.testData;
                }
            } else {
                alert('Geçersiz test dosyası!');
                window.location.href = 'tests.html';
            }
        });
    </script>
    <script>
        // --- Global Helper & UI Functions ---

        // Sharing functions rely on 'window.currentTestForSharing'
        function shareToWhatsApp() {
            if (!window.currentTestForSharing) return;
            const text = `${window.currentTestForSharing.metadata.title} sonucumu gördüm! Testi çözmek için: ${window.location.href}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }
        function shareToTwitter() {
            if (!window.currentTestForSharing) return;
            const text = `${window.currentTestForSharing.metadata.title} sonucumu gördüm! #PsikolojiTesti`;
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`, '_blank');
        }
        function shareToInstagram() {
            if (!window.currentTestForSharing) return;
            navigator.clipboard.writeText(`${window.currentTestForSharing.metadata.title} sonucumu gördüm! Testi çözmek için: ${window.location.href}`);
            alert(`Sonuç metni kopyalandı! Instagram'da paylaşabilirsiniz.`);
        }
        function downloadResult() {
            alert('PDF indirme özelliği yakında eklenecek!');
        }

        // --- Nav & Drawer Functions ---
        function toggleDrawer() {
            const drawer = document.getElementById('mobileDrawer');
            const drawerContent = drawer.querySelector('div > div');
            const nav = document.getElementById('mainNav');

            if (drawer.classList.contains('opacity-0')) {
                drawer.classList.remove('opacity-0', 'pointer-events-none');
                drawer.classList.add('opacity-100', 'pointer-events-auto');
                drawerContent.classList.remove('translate-x-full');
                drawerContent.classList.add('translate-x-0');
                document.body.style.overflow = 'hidden';
                nav.style.display = 'none';
            } else {
                drawer.classList.remove('opacity-100', 'pointer-events-auto');
                drawer.classList.add('opacity-0', 'pointer-events-none');
                drawerContent.classList.remove('translate-x-0');
                drawerContent.classList.add('translate-x-full');
                document.body.style.overflow = '';
                nav.style.display = 'flex';
            }
        }

        document.getElementById('mobileDrawer').addEventListener('click', function (e) {
            if (e.target === this) {
                toggleDrawer();
            }
        });

        let lastScrollTop = 0;
        let ticking = false;
        const nav = document.getElementById('mainNav');

        function updateNavOnScroll() {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            if (scrollTop > 50) {
                nav.style.background = 'rgba(255, 255, 255, 0.98)';
                nav.style.backdropFilter = 'blur(20px) saturate(180%)';
            } else {
                nav.style.background = 'rgba(255, 255, 255, 0.95)';
                nav.style.backdropFilter = 'blur(16px) saturate(180%)';
            }
            lastScrollTop = scrollTop;
            ticking = false;
        }

        window.addEventListener('scroll', function () {
            if (!ticking) {
                requestAnimationFrame(updateNavOnScroll);
                ticking = true;
            }
        }, { passive: true });
    </script>
</body>

</html>
